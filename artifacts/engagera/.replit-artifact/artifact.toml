kind = "web"
previewPath = "/"
title = "Engagera"
version = "1.0.0"
id = "artifacts/engagera"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24935

[services.development]
run = "pnpm --filter @workspace/engagera run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/engagera", "run", "build" ]
serve = "static"
publicDir = "artifacts/engagera/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24935"
BASE_PATH = "/"
