openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Engagera AI Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: apikeys
    description: API key management
  - name: usage
    description: Usage analytics
  - name: models
    description: Available AI models
  - name: chat
    description: AI chat completions
  - name: conversations
    description: Conversation history
  - name: dashboard
    description: Dashboard summary data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List available Engagera models
      responses:
        "200":
          description: List of Engagera models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"

  /api-keys:
    get:
      operationId: listApiKeys
      tags: [apikeys]
      summary: List all API keys for the authenticated user
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createApiKey
      tags: [apikeys]
      summary: Create a new API key
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created API key (secret shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          description: Unauthorized

  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [apikeys]
      summary: Revoke an API key
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: header
          name: x-user-id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found

  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      summary: Get usage records for the authenticated user
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
          required: true
        - in: query
          name: days
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Usage records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageRecord"

  /usage/summary:
    get:
      operationId: getUsageSummary
      tags: [usage]
      summary: Get aggregated usage summary (dashboard wow endpoint)
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Usage summary with totals and breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get high-level dashboard stats for the user
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /chat:
    post:
      operationId: chatCompletion
      tags: [chat]
      summary: Send a chat message to Engagera AI (auth or guest via x-guest-session-id)
      parameters:
        - in: header
          name: x-user-id
          schema:
            type: string
          required: false
        - in: header
          name: x-guest-session-id
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "429":
          description: Rate limited or guest limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestLimitResponse"
        "500":
          description: AI error (safe fallback returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations for the current user or guest session
      parameters:
        - in: header
          name: x-guest-session-id
          schema:
            type: string
          required: false
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: header
          name: x-guest-session-id
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Conversation deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found

  /conversations/{id}/messages:
    get:
      operationId: getConversationMessages
      tags: [conversations]
      summary: Get all messages in a conversation
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
        - in: header
          name: x-guest-session-id
          schema:
            type: string
          required: false
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationMessage"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Model:
      type: object
      required: [id, name, description, category, contextWindow]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [lite, pro, reason, code, vision, voice]
        contextWindow:
          type: integer
        available:
          type: boolean

    ApiKey:
      type: object
      required: [id, name, prefix, createdAt, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
        lastUsedAt:
          type: ["string", "null"]
        isActive:
          type: boolean
        totalRequests:
          type: integer

    ApiKeyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    ApiKeyCreated:
      type: object
      required: [id, name, prefix, key, createdAt, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        prefix:
          type: string
        key:
          type: string
        createdAt:
          type: string
        isActive:
          type: boolean

    UsageRecord:
      type: object
      required: [id, model, inputTokens, outputTokens, totalTokens, createdAt]
      properties:
        id:
          type: integer
        model:
          type: string
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer
        createdAt:
          type: string
        apiKeyName:
          type: ["string", "null"]

    UsageSummary:
      type: object
      required: [totalRequests, totalTokens, totalInputTokens, totalOutputTokens, byModel, dailyUsage]
      properties:
        totalRequests:
          type: integer
        totalTokens:
          type: integer
        totalInputTokens:
          type: integer
        totalOutputTokens:
          type: integer
        byModel:
          type: array
          items:
            $ref: "#/components/schemas/ModelUsage"
        dailyUsage:
          type: array
          items:
            $ref: "#/components/schemas/DailyUsage"

    ModelUsage:
      type: object
      required: [model, requests, tokens]
      properties:
        model:
          type: string
        requests:
          type: integer
        tokens:
          type: integer

    DailyUsage:
      type: object
      required: [date, requests, tokens]
      properties:
        date:
          type: string
        requests:
          type: integer
        tokens:
          type: integer

    DashboardStats:
      type: object
      required: [activeKeys, totalRequests, totalTokensThisMonth, topModel, recentActivity]
      properties:
        activeKeys:
          type: integer
        totalRequests:
          type: integer
        totalTokensThisMonth:
          type: integer
        topModel:
          type: ["string", "null"]
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/RecentActivity"

    RecentActivity:
      type: object
      required: [model, tokens, createdAt]
      properties:
        model:
          type: string
        tokens:
          type: integer
        createdAt:
          type: string

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        model:
          type: string
          default: "engagera-pro"
        conversationId:
          type: integer
          description: Existing conversation to continue. Omit to auto-create a new one.
        stream:
          type: boolean
          default: false

    ChatResponse:
      type: object
      required: [id, model, message, usage, conversationId]
      properties:
        id:
          type: string
        model:
          type: string
        message:
          $ref: "#/components/schemas/ChatMessage"
        usage:
          $ref: "#/components/schemas/TokenUsage"
        conversationId:
          type: integer
        guestMessageCount:
          type: integer
          description: How many messages this guest session has used (guests only)
        guestMessageLimit:
          type: integer
          description: Total free messages allowed for guests

    GuestLimitResponse:
      type: object
      required: [error, guestMessageCount, guestMessageLimit]
      properties:
        error:
          type: string
        guestMessageCount:
          type: integer
        guestMessageLimit:
          type: integer

    TokenUsage:
      type: object
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer

    Conversation:
      type: object
      required: [id, title, model, messageCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        model:
          type: string
        messageCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ConversationMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
